name: Публикация и деплой сайта

on:
  push:
    branches: [main]
  schedule:
    # Пн/Ср/Пт в 06:00 UTC (09:00 МСК) — публикует по publish_per_run статей из очереди
    - cron: "0 6 * * 1,3,5"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publish-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install markdown

      - name: Опубликовать следующую статью из очереди (только по расписанию)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/publish_next.py

      - name: Закоммитить изменения в очереди/публикациях
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "podarok-guide-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/
          git diff --cached --quiet && echo "Нет изменений" || git commit -m "auto: публикация статьи из очереди"
          git push || echo "Нечего пушить"

      - name: Собрать сайт
        run: python scripts/build.py

      - name: Загрузить артефакт Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Деплой на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
